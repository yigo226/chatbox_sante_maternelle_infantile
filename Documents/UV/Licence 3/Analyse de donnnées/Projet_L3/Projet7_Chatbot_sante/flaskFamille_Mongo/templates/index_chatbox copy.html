
{% extends "base.html" %}
{% block content %}

<div class="chat-layout">

    <!-- SIDEBAR À DROITE -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="/static/img/sagefemme.png" class="sf-avatar">
            <h4>{{ session.femme.nom }}</h4>
            <p class="online">● En ligne</p>
        </div>

        <ul class="menu">
            <li><a href="/dashboard">👶 Mes enfants</a></li>
            <li><a href="/visites">📅 Mes visites</a></li>
            <li><a href="/rappels">⏰ Rappels</a></li>
            <li><a href="/profile">⚙️ Paramètres</a></li>
            <li><a href="/aide">❓ Aide</a></li>
        </ul>
    </aside>

    <!-- CHATBOX CENTRALE -->
    <div class="chat-wrapper">
        <div class="chat-header">
            <h2>Ma Sage-Femme</h2>
            <p class="sub">Assistant virtuel médical</p>
        </div>

        <div id="chat-box" class="chat-box">
            <!-- Messages ajoutés ici en JS -->

        </div>

        <!-- Champ de saisie fixe en bas -->
        <div id="user-input" class="user-input">
            <input type="text" id="message" placeholder="Écrivez votre question…">
            <button onclick="sendMessage()">Envoyer</button>
        </div>
    </div>

</div>
<script src="/static/js/script.js"></script>
{% endblock %}
