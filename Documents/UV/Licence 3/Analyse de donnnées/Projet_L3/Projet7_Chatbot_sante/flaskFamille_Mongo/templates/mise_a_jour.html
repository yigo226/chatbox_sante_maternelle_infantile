{% extends "base.html" %}
{% block title %}Mise à jour{% endblock %}

{% block content %}

<style>
    /* Conteneur centré */
    .update-container {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Carte moderne */
    .update-card {
        width: 380px;
        background: rgba(255, 255, 255, 0.15);
        padding: 30px;
        border-radius: 18px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 6px 15px rgba(0,0,0,0.25);
        animation: fadeIn 0.4s ease-in-out;
    }

    /* Animation d’apparition */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* Titres */
    .update-card h2 {
        text-align: center;
        color: rgb(15, 13, 13);
        margin-bottom: 20px;
        font-weight: bold;
    }

    /* Champs */
    .update-card label {
        color: rgb(8, 8, 8);
        font-weight: 500;
    }

    .update-card select,
    .update-card input {
        background: rgba(255,255,255,0.35);
        color: #000;
        border: none;
        border-radius: 10px;
    }

    /* Bouton */
    .update-btn {
        background: #ff2e63;
        border: none;
        font-weight: bold;
        padding: 10px;
        border-radius: 10px;
        width: 100%;
        transition: 0.2s;
    }
    .update-btn:hover {
        background: #e02655;
    }
</style>


<div class="update-container">
    <div class="update-card">
        <h2>Mise à jour</h2>

        <form method="POST">
            <div class="mb-3">
                <label form="enceinte" class="form-label">Êtes-vous enceinte ?</label>
                <select class="form-select" name="enceinte" id="enceinte-select">
                    <option value="non">Non</option>
                    <option value="oui">Oui</option>
                </select>
            </div>

            <div class="mb-3" id="mois-grossesse-div" style="display:none;">
                <label for="mois_grossesse" class="form-label">Mois de grossesse</label>
                <input type="number" min="1" max="9" class="form-control" name="mois_grossesse">
            </div>

            <button type="submit" class="update-btn">Mettre à jour</button>
        </form>
    </div>
</div>


<script>
document.getElementById('enceinte-select').addEventListener('change', function(){
    document.getElementById('mois-grossesse-div').style.display =
        this.value === 'oui' ? 'block' : 'none';
});
</script>

{% endblock %}
